<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
            background-size: 800% 800%;
            animation: gradientMove 10s ease infinite;
            text-align: center;
            color: white;
        }

        /* Moving background */
        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        h1 {
            margin-top: 120px;
            font-size: 48px;
            animation: fadeIn 3s ease forwards;
        }

        p {
            font-size: 22px;
            width: 70%;
            margin: auto;
            animation: fadeIn 5s ease forwards;
        }

        /* Text fade animation */
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        button {
            margin-top: 30px;
            background-color: white;
            color: #ff4d88;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: scale(1.1);
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            color: #ff4d88;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {transform: translateY(0); opacity: 1;}
            100% {transform: translateY(-100vh); opacity: 0;}
        }
    </style>
</head>

<body>

    <h1>Happy Valentine’s Day 💖</h1>
    <p>You make my world brighter, warmer, and happier every single day.</p>

    <button onclick="showLove()">Click for surprise 💌</button>

    <script>
        function showLove() {
            alert("I love you more than yesterday, but less than tomorrow ❤️");
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerText = "❤️";

            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.bottom = "0px";
            heart.style.fontSize = (Math.random() * 20 + 20) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
